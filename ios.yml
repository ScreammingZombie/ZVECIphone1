name: Compilar IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto de Xcode
        run: xcodegen generate
      - name: Compilar (sin firmar)
        run: |
          xcodebuild -project ZombieVectorizer.xcodeproj \
            -scheme ZombieVectorizer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Armar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZombieVectorizer.app Payload/
          zip -qry ZombieVectorizer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieVectorizer-ipa
          path: ZombieVectorizer.ipa
