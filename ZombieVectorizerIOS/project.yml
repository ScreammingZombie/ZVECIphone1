name: ZombieVectorizer
options:
  bundleIdPrefix: com.pvm
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ZombieVectorizer:
    type: application
    platform: iOS
    sources:
      - path: ZombieVectorizer
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Zombie Vectorizer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: BG
        UIAppFonts:
          - Dark_Zombie.ttf
          - Scary_Zombie.ttf
        NSCameraUsageDescription: Para sacar fotos y convertirlas a vector.
        NSPhotoLibraryAddUsageDescription: Para guardar imágenes en Fotos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pvm.zombievectorizer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "-enforce-exclusivity=unchecked"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Ounchecked"
